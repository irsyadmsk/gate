apply plugin: 'com.android.application'

def gateReleaseEnabled = providers.environmentVariable('GATE_ANDROID_RELEASE').orNull == '1'
def requiredReleaseValue = { name ->
    def value = providers.environmentVariable(name).orNull
    if (!value) throw new GradleException("Missing release setting: ${name}")
    value
}

// versionName mengikuti "version" di package.json. versionCode naik monoton dari env; rilis wajib mengisinya.
def gateVersionName = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def gateVersionCode = {
    def raw = providers.environmentVariable('GATE_ANDROID_VERSION_CODE').orNull
    if (!raw) {
        if (gateReleaseEnabled) throw new GradleException('Missing release setting: GATE_ANDROID_VERSION_CODE')
        return 1
    }
    if (!(raw ==~ /[1-9][0-9]{0,9}/) || raw.toLong() > 2100000000L) {
        throw new GradleException('GATE_ANDROID_VERSION_CODE harus bilangan bulat 1..2100000000')
    }
    return raw.toInteger()
}()

android {
    namespace = "com.irsyads.gate"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.irsyads.gate"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode gateVersionCode
        versionName gateVersionName
        manifestPlaceholders.gateAppLinkHost = providers.environmentVariable('PUBLIC_GATE_ANDROID_APP_LINK_HOST').orElse('gate.irsyads.com').get()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        // Callback App Link hanya dibutuhkan login OAuth (fase 2); versi rilis memakai formulir login di aplikasi.
        debug.manifest.srcFile 'src/appLinks/AndroidManifest.xml'
    }
    signingConfigs {
        if (gateReleaseEnabled) {
            release {
                storeFile = rootProject.file(requiredReleaseValue('GATE_ANDROID_UPLOAD_STORE_FILE'))
                storePassword = requiredReleaseValue('GATE_ANDROID_UPLOAD_STORE_PASSWORD')
                keyAlias = requiredReleaseValue('GATE_ANDROID_UPLOAD_KEY_ALIAS')
                keyPassword = requiredReleaseValue('GATE_ANDROID_UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        fixture {
            initWith debug
            applicationIdSuffix '.fixture'
            versionNameSuffix '-fixture'
            matchingFallbacks = ['debug']
            resValue 'string', 'app_name', 'Irsyads Gate Uji'
        }
        release {
            if (gateReleaseEnabled) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

androidComponents {
    beforeVariants(selector().withBuildType('release')) { variant ->
        variant.enable = gateReleaseEnabled
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
